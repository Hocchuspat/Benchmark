name: Build desktop application

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        default: both
        options: [both, windows]
  push:
    branches: ["build/windows-**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.platform == 'windows' || startsWith(github.ref, 'refs/heads/build/windows-')) && '["windows-2025"]' || '["macos-15", "windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run source tests on macOS
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build native app with bundled Codex
        run: python scripts/build_app.py
      - name: Check macOS bundle without system Python
        if: runner.os == 'macOS'
        run: python scripts/smoke_app.py dist/Benchmark.app
      - name: Check Windows bundle without system Python
        if: runner.os == 'Windows'
        run: python scripts/smoke_app.py dist/Benchmark
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: Benchmark-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/Benchmark-*.zip
            dist/Benchmark-*.zip.sha256
            dist/START.txt
          if-no-files-found: error
          retention-days: 14
