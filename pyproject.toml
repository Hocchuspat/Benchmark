[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-research"
version = "0.1.2"
description = "Подготовка досье компаний через Codex CLI: терминал и настольное приложение"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.12,<7"]

[project.scripts]
benchmark = "benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.setuptools.package-data]
benchmark = ["resources/*.json", "resources/*.svg"]
